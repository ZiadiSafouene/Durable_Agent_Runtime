[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-agent-runtime"
version = "0.1.0"
description = "Crash-safe, replayable multi-step agent orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Durable Agent Runtime" }]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncmy>=0.2.9,<0.3.0",
  "pymysql>=1.1.1,<2.0.0",
  "alembic>=1.14.0,<2.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "cryptography>=43.0.0,<47.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
]

[project.scripts]
durable-worker = "app.workers.main:main"
durable-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "mysql: tests that require a running MySQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
